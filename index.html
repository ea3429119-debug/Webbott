<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astral Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b10;
            color: white;
            min-height: 100vh;
        }

        nav {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid #20202a;
            background: #0e0e14;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .login {
            background: #5865f2;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 100px 20px;
            text-align: center;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 span {
            color: #5865f2;
        }

        p {
            color: #aaa;
            font-size: 19px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .start {
            display: inline-block;
            background: #5865f2;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .cards {
            margin-top: 80px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: #12121a;
            border: 1px solid #242432;
            padding: 30px;
            border-radius: 18px;
        }

        .card h2 {
            margin-bottom: 12px;
        }

        .card p {
            font-size: 15px;
            margin: 0;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 38px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            nav {
                padding: 0 20px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Astral</div>

    <a class="login" href="#">
        تسجيل الدخول
    </a>
</nav>

<main>

    <h1>
        تحكم ببوتك من <span>Astral</span>
    </h1>

    <p>
        لوحة تحكم بسيطة وسريعة لإدارة بوت Discord
        والسيرفرات الخاصة بك من مكان واحد.
    </p>

    <a class="start" href="#">
        ابدأ الآن
    </a>

    <div class="cards">

        <div class="card">
            <h2>🎫 Tickets</h2>
            <p>
                أنشئ نظام تذاكر متكامل وقابل للتخصيص.
            </p>
        </div>

        <div class="card">
            <h2>🛡️ Protection</h2>
            <p>
                إعدادات الحماية والموديريشن بسهولة.
            </p>
        </div>

        <div class="card">
            <h2>⚙️ Dashboard</h2>
            <p>
                تحكم بإعدادات البوت من لوحة واحدة.
            </p>
        </div>

    </div>

</main>

</body>
</html>
